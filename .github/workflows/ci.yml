name: CI

on:
  push:
    branches: [main, master, 'feat/**', 'fix/**', 'feature/**']
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (.NET 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore backend/FreelanceFlow.sln

      - name: Build
        run: dotnet build backend/FreelanceFlow.sln --no-restore -c Release

      - name: Unit tests
        run: >
          dotnet test backend/FreelanceFlow.sln
          --no-build -c Release
          --filter "FullyQualifiedName~UnitTests"
          --logger "console;verbosity=minimal"

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
